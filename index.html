<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>Jarvis</title>
<style>
:root{--bg:#faf9f5;--panel:#ffffff;--user:#efece4;--ink:#1f1e1d;--dim:#73706a;--line:#e3dfd5;--accent:#c4613a}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--panel:#30302e;--user:#3a3936;--ink:#f1efe8;--dim:#a19e94;--line:#44423e;--accent:#e08a66}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:4px;padding:10px 14px}
h1{margin:0;flex:1;font:600 22px Georgia,serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
.ib{width:44px;height:44px;border-radius:50%;border:none;background:none;font-size:21px;display:grid;place-items:center}
.ib:active{background:var(--user)}
#log{flex:1;overflow-y:auto;width:100%;max-width:720px;margin:0 auto;padding:8px 18px;display:flex;flex-direction:column;gap:18px}
#empty{margin:auto;text-align:center;font:30px/1.25 Georgia,serif;color:var(--dim);padding:0 20px}
.m{white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;max-width:85%;background:var(--user);padding:10px 16px;border-radius:20px 20px 6px 20px}
.m.j{align-self:flex-start;font:18px/1.6 Georgia,serif;padding:2px}
.m a{color:var(--accent)}
#status{text-align:center;color:var(--dim);font-size:14px;min-height:20px}
#composer{width:calc(100% - 28px);max-width:720px;margin:4px auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:6px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
#composer:focus-within{border-color:var(--accent)}
#txt{flex:1;min-width:0;height:44px;border:none;background:transparent;color:var(--ink);font-size:17px;padding:0 8px;outline:none}
#mic.on{background:var(--user);box-shadow:inset 0 0 0 2px var(--accent)}
#mic.awake{background:var(--accent)}
#send{background:var(--accent);color:#fff;font-size:22px;font-weight:700}
.ib:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;font:600 20px Georgia,serif}
dialog label{display:block;margin:14px 0 6px;color:var(--dim);font-size:14px}
dialog input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font-size:16px}
pre{margin:0;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.4 system-ui,sans-serif;max-height:160px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-size:15px}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <h1>Jarvis</h1>
  <button class="ib" id="voice" aria-label="Risposte a voce">🔊</button>
  <button class="ib" id="cfg" aria-label="Impostazioni e memoria">⚙️</button>
</header>
<div id="log" aria-live="polite"><div id="empty">Come posso aiutarti?</div></div>
<div id="status"></div>
<div id="composer">
  <button class="ib" id="mic" aria-label="Attiva o disattiva l'ascolto">🎙</button>
  <input id="txt" placeholder="Scrivi o di' «Jarvis…»" enterkeyhint="send" autocomplete="off">
  <button class="ib" id="send" aria-label="Invia">↑</button>
</div>

<dialog id="dlg">
  <h2>Impostazioni</h2>
  <label for="key">Chiave Gemini (resta solo su questo telefono)</label>
  <input id="key" type="password" autocomplete="off">
  <label>Cosa ricordo di te</label>
  <pre id="facts"></pre>
  <div class="row">
    <button class="btn main" id="saveKey">Salva chiave</button>
    <button class="btn" id="clrFacts">Cancella memoria</button>
    <button class="btn" id="clrChat">Cancella conversazione</button>
    <button class="btn" id="close">Chiudi</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const MODELS = ['gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-3.6-flash'];
const NUM = {uno:1,un:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,undici:11,dodici:12,quindici:15,venti:20,trenta:30,quaranta:40,quarantacinque:45,cinquanta:50,sessanta:60};
const WAKE = /\b(jarvis|giarvis|garvis|jarvi|darvis|jarves)\b/i;

let rec, on = false, awake = false, speaking = false, busy = false, awakeTimer, wake;
let voice = store.get('j_voice', true);
let facts = store.get('j_facts', []);
let hist = store.get('j_hist', []);
let chat = store.get('j_chat', []);

/* ---------- interfaccia ---------- */
function render(who, text, link){
  const e = $('empty'); if(e) e.remove();
  const d = document.createElement('div');
  d.className = 'm ' + who;
  d.textContent = text + (link ? ' ' : '');
  if(link){ const a = document.createElement('a'); a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Apri'; d.appendChild(a); }
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}
function log(who, text, link){
  render(who, text, link);
  chat.push({who, text, link}); chat = chat.slice(-60); store.set('j_chat', chat);
}
function setState(){
  $('status').textContent = busy ? 'Sto pensando…' : !on ? '' : awake ? 'Ti ascolto…' : 'In ascolto: di\' «Jarvis»';
  $('mic').className = 'ib' + (on ? (awake ? ' awake' : ' on') : '');
}
function setVoiceIcon(){
  $('voice').textContent = voice ? '🔊' : '🔇';
  $('voice').setAttribute('aria-label', voice ? 'Risposte a voce attive' : 'Risposte a voce disattivate');
}
chat.forEach(c => render(c.who, c.text, c.link));
setVoiceIcon();

/* ---------- voce ---------- */
function say(text, link, force){
  log('j', text, link);
  if(!(voice || force) || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'it-IT';
  speaking = true;
  try{ rec && rec.stop(); }catch(e){}
  const done = () => { speaking = false; if(on) start(); };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}

function start(){
  if(!SR || speaking) return;
  if(!rec){
    rec = new SR();
    rec.lang = 'it-IT';
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = e => {
      for(let i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal) heard(e.results[i][0].transcript.trim());
      }
    };
    rec.onend = () => { if(on && !speaking) setTimeout(start, 300); };
    rec.onerror = e => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        on = false; setState();
        say('Il microfono è bloccato. In Chrome tocca il lucchetto accanto all\'indirizzo e consenti il microfono.', null, true);
      }
    };
  }
  try{ rec.start(); }catch(e){}
}

async function toggle(){
  if(!SR){ say('Questo browser non supporta il riconoscimento vocale. Usa Chrome.'); return; }
  on = !on;
  if(on){
    try{ wake = await navigator.wakeLock.request('screen'); }catch(e){}
    start();
  } else {
    try{ rec.stop(); }catch(e){}
    try{ wake && wake.release(); }catch(e){}
    speechSynthesis.cancel();
    awake = false;
  }
  setState();
}

function heard(text){
  if(!awake){
    const m = text.match(WAKE);
    if(!m) return;
    const cmd = text.slice(m.index + m[0].length).replace(/^[\s,.:!?]+/, '');
    log('u', text);
    if(!cmd){
      awake = true; setState();
      clearTimeout(awakeTimer);
      awakeTimer = setTimeout(() => { awake = false; setState(); }, 8000);
      say('Dimmi.');
      return;
    }
    run(cmd);
  } else {
    awake = false; clearTimeout(awakeTimer); setState();
    log('u', text);
    run(text);
  }
}

/* ---------- memoria ---------- */
function addFact(f){
  f = f.trim().replace(/[.\s]+$/, '');
  if(!f || facts.includes(f)) return;
  facts.push(f); facts = facts.slice(-40); store.set('j_facts', facts);
}
function notes(){ try{ return JSON.parse(localStorage.getItem('jarvis_notes') || '[]'); }catch(e){ return []; } }
function saveNotes(a){ try{ localStorage.setItem('jarvis_notes', JSON.stringify(a)); }catch(e){} }

/* ---------- Gemini ---------- */
function sys(){
  let s = 'Sei Jarvis, assistente personale di Valentino (agenzia di viaggi Gioia di Viaggiare e officina di customizzazione moto e artigianato). Rispondi in italiano, in modo naturale e amichevole. ';
  s += voice ? 'La risposta viene letta ad alta voce: al massimo due o tre frasi brevi, niente elenchi né formattazione. '
             : 'Risposte chiare e concise, in testo semplice senza markdown. ';
  if(facts.length) s += 'Cose che sai di Valentino: ' + facts.join('; ') + '. ';
  s += 'Se Valentino ti dice un\'informazione personale duratura che vale la pena ricordare, aggiungi alla fine della risposta, esattamente così: [[RICORDA: informazione breve]].';
  return s;
}

async function ask(q){
  let key = '';
  try{ key = localStorage.getItem('jarvis_key') || ''; }catch(e){}
  if(!key){
    say('Per rispondere a tutto mi serve la chiave Gemini. Tocca l\'ingranaggio in alto e incollala.');
    return;
  }
  hist.push({role:'user', parts:[{text:q}]});
  hist = hist.slice(-20);
  while(hist.length && hist[0].role !== 'user') hist.shift();
  busy = true; setState();
  try{
    for(const model of MODELS){
      try{
        const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent', {
          method:'POST',
          headers:{'Content-Type':'application/json', 'x-goog-api-key': key},
          body: JSON.stringify({systemInstruction:{parts:[{text:sys()}]}, contents:hist})
        });
        if(r.status === 429){ hist.pop(); say('Ho finito le richieste gratuite per ora. Riprova tra un minuto.'); return; }
        if(r.status === 400 || r.status === 401 || r.status === 403){ hist.pop(); say('C\'è un problema con la chiave. Tocca l\'ingranaggio e incollala di nuovo.'); return; }
        if(!r.ok) continue;
        const j = await r.json();
        const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
        let t = parts.map(p => p.text || '').join(' ');
        [...t.matchAll(/\[\[RICORDA:(.*?)\]\]/g)].forEach(x => addFact(x[1]));
        t = t.replace(/\[\[RICORDA:.*?\]\]/g, '').replace(/[*#`]/g, '').trim();
        if(t){
          hist.push({role:'model', parts:[{text:t}]});
          store.set('j_hist', hist);
          say(t);
          return;
        }
      }catch(e){}
    }
    hist.pop();
    say('Non riesco a collegarmi a Gemini adesso. Controlla la connessione e riprova.');
  } finally {
    busy = false; setState();
    store.set('j_hist', hist);
  }
}

/* ---------- comandi locali ---------- */
function toNum(s){ s = s.trim().toLowerCase(); return /^\d+$/.test(s) ? parseInt(s, 10) : (NUM[s] || NaN); }

function run(cmd){
  let m;
  cmd = cmd.replace(/[?!.]+$/, '').trim();

  if(/(imposta|cambia|inserisci).*chiave/i.test(cmd)){ openCfg(); return; }
  if((m = cmd.match(/timer.*?(\w+)\s*(second\w*|minut\w*|or[ae])/i))){
    const n = toNum(m[1]);
    if(!isNaN(n)){
      const u = m[2].toLowerCase();
      const unit = u.startsWith('s') ? 1 : u.startsWith('m') ? 60 : 3600;
      const label = n + ' ' + u;
      say('Timer di ' + label + ' avviato.');
      setTimeout(() => { try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){} say('Il timer di ' + label + ' è finito.', null, true); }, n * unit * 1000);
      return;
    }
  }
  if(/che ore|che ora|l'ora/i.test(cmd)){
    say('Sono le ' + new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}) + '.');
    return;
  }
  if(
